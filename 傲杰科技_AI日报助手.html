<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报助手 · 阿里云版</title>
<style>
/* 回归深色专业 UI 风格 */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

:root {
  --bg: #0d0f14;           /* 深邃背景色 */
  --surface: #141720;      /* 卡片表面色 */
  --surface2: #1c2030;     /* 次级表面色 */
  --border: rgba(255,255,255,0.07); 
  --text: #f0f2f8;         /* 主文字颜色 */
  --text-sec: #8b90a0;     /* 次要文字颜色 */
  --blue: #4f8eff;         /* 品牌蓝色 */
  --teal: #2dd4bf;         /* 成功青色 */
  --amber: #fbbf24;        /* 警示琥珀色 */
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body { 
  font-family: 'Inter', sans-serif; 
  background: var(--bg); 
  color: var(--text); 
  padding: 3rem 1.25rem; 
  -webkit-font-smoothing: antialiased; 
}

/* 保持你喜欢的 Logo 和按钮设计 */
.container { max-width: 600px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 2rem; }
.logo { 
  width: 50px; height: 50px; 
  background: linear-gradient(135deg, #4f8eff, #7b61ff); 
  border-radius: 12px; margin: 0 auto 10px; 
  display: flex; align-items: center; justify-content: center; 
  font-weight: bold; color: white;
}

textarea { 
  width: 100%; min-height: 150px; 
  background: var(--surface); 
  border: 1px solid var(--border); 
  border-radius: 12px; color: #fff; 
  padding: 15px; outline: none; 
  margin-bottom: 15px; line-height: 1.6; 
}

.btn-gen { 
  width: 100%; padding: 15px; 
  background: var(--blue); 
  border: none; border-radius: 12px; 
  color: #fff; font-weight: 600; 
  cursor: pointer; transition: 0.3s; 
  box-shadow: 0 4px 20px rgba(79,142,255,0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 3rem 1.25rem; }
.container { max-width: 600px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 2rem; }
.logo { width: 50px; height: 50px; background: linear-gradient(135deg, #4f8eff, #7b61ff); border-radius: 12px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
textarea { width: 100%; min-height: 150px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: #fff; padding: 15px; outline: none; margin-bottom: 15px; line-height: 1.6; }
.btn-gen { width: 100%; padding: 15px; background: #4f8eff; border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; transition: 0.3s; }
.btn-gen:disabled { opacity: 0.5; }
.card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; margin-top: 15px; display: none; }
.tag { font-size: 11px; font-weight: bold; margin-bottom: 5px; display: block; }
.res-content { font-size: 14px; line-height: 1.8; margin-bottom: 15px; white-space: pre-wrap; color: #d1d5db; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">傲杰</div>
    <h1>AI 日报助手 (阿里云版)</h1>
    <p style="font-size: 12px; color: #666; margin-top: 8px;">基于通义千问大模型 · 深度润色</p>
  </div>
  
  <textarea id="userInput" placeholder="输入今天的碎活..."></textarea>
  <button id="genBtn" class="btn-gen" onclick="askQwen()">立即生成专业日报</button>

  <div id="resultCard" class="card">
    <span class="tag" style="color:var(--blue)">今日产出</span>
    <div id="today" class="res-content"></div>
    <span class="tag" style="color:var(--teal)">下阶段计划</span>
    <div id="tomorrow" class="res-content"></div>
    <span class="tag" style="color:var(--amber)">其他事项</span>
    <div id="others" class="res-content"></div>
  </div>
</div>

<script>
const ALIYUN_KEY = 'sk-321ffce88cdb43188c93b848e4765d70'; 
const API_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';

async function askQwen() {
  const raw = document.getElementById('userInput').value.trim();
  if(!raw) return alert("写点什么吧");

  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.innerText = "通义千问正在润色中...";

// 优化后的实习生专用润色逻辑
  const systemPrompt = `你是一位严谨且有上进心的职场新人。请将用户的零碎工作记录润色为专业、清晰、踏实的日报。
要求：
1. 语言风格：专业但不浮夸。避免使用过于宏大的大厂黑话，多用“协助、学习、记录、跟进、整理”等符合实习生身份的词汇。
2. 结构化表达：今日产出要体现出你的工作进度和学习成长。可以稍微多扩充一点内容。
3. 业务融合：结合用户傲杰科技的跨境电商背景，精准使用行业术语（如：Listing优化、竞品数据搜集等）。

严格输出以下JSON格式（不要包含代码块标记）：
{
  "today": "1. 序号分行，描述今天具体完成的任务及学习收获",
  "tomorrow": "1. 序号分行，描述明天的执行动作或需要请教导师的问题",
  "others": "1. 序号分行，填写遇到的困难或备注（若无则填暂无）"
}`;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${ALIYUN_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: "qwen-plus", // 阿里云的经典模型，新用户免费额度多
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: raw }
        ],
        response_format: { "type": "json_object" } // 强制要求返回 JSON
      })
    });

    const data = await response.json();
    const result = JSON.parse(data.choices[0].message.content);

    document.getElementById('today').innerText = result.today;
    document.getElementById('tomorrow').innerText = result.tomorrow;
    document.getElementById('others').innerText = result.others;
    document.getElementById('resultCard').style.display = 'block';
  } catch (error) {
    console.error(error);
    alert("接口请求失败，请检查 Key 或网络");
  } finally {
    btn.disabled = false; btn.innerText = "立即生成专业日报";
  }
}
</script>
</body>
</html>
